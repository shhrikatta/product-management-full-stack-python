<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1><i class="fas fa-box"></i> Product Management System</h1>
            <p>Manage your product inventory with ease</p>
        </header>

        <!-- Alert/Message Area -->
        <div id="alert" class="alert" style="display: none;">
            <span id="alert-message"></span>
            <button class="alert-close" onclick="closeAlert()">&times;</button>
        </div>

        <!-- Add Product Section -->
        <section class="add-product-section">
            <h2><i class="fas fa-plus-circle"></i> Add New Product</h2>
            <form id="add-product-form" class="product-form">
                <div class="form-group">
                    <label for="product-name">
                        <i class="fas fa-tag"></i> Product Name
                    </label>
                    <input type="text" id="product-name" name="name" required 
                           placeholder="Enter product name" maxlength="100">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="product-price">
                            <i class="fas fa-dollar-sign"></i> Price
                        </label>
                        <input type="number" id="product-price" name="price" required 
                               placeholder="0.00" min="0" step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="product-quantity">
                            <i class="fas fa-cubes"></i> Quantity
                        </label>
                        <input type="number" id="product-quantity" name="quantity" required 
                               placeholder="0" min="0" step="1">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Product
                    </button>
                    <button type="reset" class="btn btn-secondary">
                        <i class="fas fa-undo"></i> Clear Form
                    </button>
                </div>
            </form>
        </section>

        <!-- Products List Section -->
        <section class="products-section">
            <div class="section-header">
                <h2><i class="fas fa-list"></i> Product Inventory</h2>
                <div class="section-actions">
                    <button id="refresh-btn" class="btn btn-outline" onclick="loadProducts()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                    <span id="product-count" class="product-count">0 products</span>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-bar">
                <div class="search-input-group">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search products by name..." 
                           onkeyup="filterProducts()">
                </div>
            </div>

            <!-- Loading Spinner -->
            <div id="loading" class="loading" style="display: none;">
                <i class="fas fa-spinner fa-spin"></i> Loading products...
            </div>

            <!-- Products Grid -->
            <div id="products-grid" class="products-grid">
                <!-- Products will be loaded here dynamically -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state" style="display: none;">
                <i class="fas fa-box-open"></i>
                <h3>No Products Found</h3>
                <p>Start by adding your first product above.</p>
            </div>
        </section>
    </div>

    <!-- Edit Product Modal -->
    <div id="edit-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> Edit Product</h3>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="edit-product-form" class="product-form">
                <input type="hidden" id="edit-product-id">
                
                <div class="form-group">
                    <label for="edit-product-name">
                        <i class="fas fa-tag"></i> Product Name
                    </label>
                    <input type="text" id="edit-product-name" name="name" required 
                           placeholder="Enter product name" maxlength="100">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-product-price">
                            <i class="fas fa-dollar-sign"></i> Price
                        </label>
                        <input type="number" id="edit-product-price" name="price" required 
                               placeholder="0.00" min="0" step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="edit-product-quantity">
                            <i class="fas fa-cubes"></i> Quantity
                        </label>
                        <input type="number" id="edit-product-quantity" name="quantity" required 
                               placeholder="0" min="0" step="1">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Update Product
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-exclamation-triangle"></i> Confirm Deletion</h3>
                <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this product?</p>
                <div class="product-info">
                    <strong id="delete-product-name"></strong><br>
                    <span id="delete-product-details"></span>
                </div>
            </div>
            <div class="form-actions">
                <button id="confirm-delete-btn" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Delete Product
                </button>
                <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
