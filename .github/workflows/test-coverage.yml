name: Test Coverage CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run linting (optional)
      continue-on-error: true
      run: |
        pip install flake8
        flake8 products.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 products.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run unit tests
      run: |
        pytest -m unit -v --tb=short
    
    - name: Run integration tests
      run: |
        pytest -m integration -v --tb=short
    
    - name: Run all tests with coverage
      run: |
        pytest --cov=products --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=100 -v
    
    - name: Check coverage threshold
      run: |
        coverage report --fail-under=100
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.13'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    
    - name: Upload coverage HTML report as artifact
      uses: actions/upload-artifact@v4
      if: matrix.python-version == '3.13'
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 30
    
    - name: Comment coverage on PR
      if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MINIMUM_GREEN: 100
        MINIMUM_ORANGE: 90
    
    - name: Generate coverage badge
      if: matrix.python-version == '3.13' && github.ref == 'refs/heads/develop'
      run: |
        pip install coverage-badge
        coverage-badge -o coverage.svg -f
    
    - name: Test Summary
      if: always()
      run: |
        echo "## Test Results Summary 📊" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Python Version: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        pytest --co -q | head -20 >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        coverage report >> $GITHUB_STEP_SUMMARY || echo "Coverage report not available" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Tests failed or coverage is below 100%"
        echo "Please fix the failing tests or improve code coverage."
        exit 1

  docker-build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker compose build
    
    - name: Start Docker containers
      run: |
        docker compose up -d
    
    - name: Wait for services to be healthy
      run: |
        echo "Waiting for MongoDB to be ready..."
        timeout 60 bash -c 'until docker compose exec -T mongodb mongosh --eval "db.runCommand({ping: 1})" --quiet; do sleep 2; done'
        echo "Waiting for Flask app to be ready..."
        timeout 60 bash -c 'until curl -f http://localhost:5002/health; do sleep 2; done'
    
    - name: Test API endpoints
      run: |
        echo "Testing health endpoint..."
        curl -f http://localhost:5002/health
        
        echo "Testing create product..."
        curl -X POST http://localhost:5002/api/products \
          -H "Content-Type: application/json" \
          -d '{"name": "Docker Test Apple", "price": 3.50, "quantity": 20}' \
          -f
        
        echo "Testing get all products..."
        curl -f http://localhost:5002/api/products
    
    - name: View container logs
      if: always()
      run: |
        echo "=== MongoDB Logs ==="
        docker compose logs mongodb
        echo "=== Flask App Logs ==="
        docker compose logs app
    
    - name: Stop Docker containers
      if: always()
      run: |
        docker compose down -v

  coverage-enforcement:
    runs-on: ubuntu-latest
    needs: test-and-coverage
    if: always()
    
    steps:
    - name: Check test results
      run: |
        if [ "${{ needs.test-and-coverage.result }}" != "success" ]; then
          echo "❌ Test suite failed or coverage is below threshold!"
          echo "Required: 100% coverage"
          echo "Action: Fix failing tests and ensure coverage remains at 100%"
          exit 1
        else
          echo "✅ All tests passed with 100% coverage!"
        fi
