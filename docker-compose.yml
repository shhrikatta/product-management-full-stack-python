# Docker Compose configuration for Products API
# Includes Flask app and MongoDB database

version: '3.8'

services:
  # ============================================================================
  # MongoDB Database Service
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: products-mongodb
    restart: unless-stopped
    
    # Port mapping - MongoDB default port
    ports:
      - "27017:27017"
    
    # Environment variables for MongoDB
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: products
    
    # Persistent volume for database data
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    
    # Health check for MongoDB
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/products --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    # Network configuration
    networks:
      - products-network

  # ============================================================================
  # Flask Application Service
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: products-api
    restart: unless-stopped
    
    # Port mapping - Flask app
    ports:
      - "5002:5002"
    
    # Environment variables for Flask app
    environment:
      # MongoDB connection with authentication
      MONGO_URI: "mongodb://admin:admin123@mongodb:27017/products?authSource=admin"
      DATABASE_NAME: "products"
      COLLECTION_NAME: "fruits"
      FLASK_ENV: "production"
    
    # Dependencies - wait for MongoDB to be ready
    depends_on:
      mongodb:
        condition: service_healthy
    
    # Health check for Flask app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    
    # Network configuration
    networks:
      - products-network
    
    # Optional: Mount code for development (comment out for production)
    # volumes:
    #   - ./products.py:/app/products.py
    #   - ./templates:/app/templates
    #   - ./static:/app/static

# ============================================================================
# Named Volumes - Persist data across container restarts
# ============================================================================
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

# ============================================================================
# Networks - Isolate services
# ============================================================================
networks:
  products-network:
    driver: bridge
